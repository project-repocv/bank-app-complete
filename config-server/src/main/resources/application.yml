server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: file://${CONFIG_REPO_PATH:/workspace/config-repo}
          search-paths: '*'
          default-label: main
          force-pull: true
          timeout: 5
          clone-on-start: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.springframework.cloud.config: DEBUG
    com.bank.configserver: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

encrypt:
  fail-on-error: false
